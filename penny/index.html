<!doctype html>
<!-- Generated from Figma MCP, then converted to editable HTML/CSS. -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Penny — Case study</title>
	<meta name="description" content="Penny — case study">
	<style>
		:root{
			--pageW:1200px;
			--ink:#0c4524;
			--heroBg:#f8b2bd;
			--chipBg:#fef1f3;
			--border:#e5e7eb;
		}
		*{box-sizing:border-box}
		html,body{margin:0;padding:0}
		body{
			font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
			background:#fff;
			color:#111827;
		}
		/* Top navigation — match Home's layout */
		.topbar{
			position:sticky;
			top:0;
			z-index:10;
			background:#fff;
			border-bottom:1px solid var(--border);
		}
		.topbar-inner{
			width:1200px;
			margin:0 auto;
			padding:31px 49px 31px 0;
			display:flex;
			align-items:center;
			justify-content:space-between;
		}
		.brand{
			padding-left:30px;
			text-decoration:none;
			display:flex;
			align-items:center;
		}
		.brand img{
			display:block;
			width:220px;
			height:52px;
			object-fit:contain;
		}
		.nav-links{
			display:flex;
			align-items:center;
			gap:20px;
			padding-top:2px;
		}
		.nav-links a{
			font-family:"IBM Plex Mono", monospace;
			font-size:24px;
			font-weight:500;
			letter-spacing:0.23px;
			line-height:22.51px;
			color:rgb(17,24,39);
			text-decoration:none;
		}
		.nav-links a:hover{
			text-decoration:underline;
			text-underline-offset:5px;
		}

		.page{max-width:100%;margin:0 auto}

		.hero{
			position:relative;
			width:100%;
			height:600px;
			background:var(--heroBg);
			overflow:hidden;
		}
		.hero-inner{
			position:relative;
			width:var(--pageW);
			height:600px;
			margin:0 auto;
		}
		.hero-title{
			position:absolute;
			left:262.21px;
			top:150.0px;
			font-family:ui-serif, Georgia, "Times New Roman", serif;
			font-weight:600;
			font-size:48px;
			color:var(--ink);
		}
		.hero-sub{
			position:absolute;
			left:266.23px;
			top:262.0px;
			width:254.49px;
			font-size:20px;
			line-height:1.5;
			color:var(--ink);
		}
		.hero-phone{
			position:absolute;
			top:62.91px;
			height:473.36px;
			width:auto;
		}
		.hero-phone.left{left:595.41px;width:224.74px}
		.hero-phone.right{left:859.09px;width:226.91px}

		.pig-chip{
			position:absolute;
			left:89px;
			top:200.91px;
			width:142px;height:142px;
			border-radius:110px;
			background:var(--chipBg);
			display:flex;align-items:center;justify-content:center;
			box-shadow:0 8px 20px rgba(12, 69, 36, 0.12);
			padding:14.5px;
		}
		.pig-chip img{width:121.8px;height:88px;object-fit:contain;display:block}

		/* responsive */
		@media (max-width: 1240px){
			:root{--pageW:100vw}
			.page{max-width:100vw}
			.hero{width:100vw}
			.hero-inner{width:100vw}
			.hero-title{left:20px}
			.hero-sub{left:20px}
			.pig-chip{left:20px}
			.hero-phone.left{left:52vw;max-width:42vw}
			.hero-phone.right{left:74vw;max-width:42vw}
		}
		@media (max-width: 1220px){
			.topbar-inner{width:100%;padding:18px 16px}
			.brand{padding-left:0}
			.brand img{width:180px;height:44px}
			.nav-links a{font-size:18px;line-height:20px}
		}
	</style>
</head>
<body>
	<header class="topbar">
		<div class="topbar-inner">
			<a class="brand" href="/" aria-label="Home">
				<img src="/assets/custom/logo.png" alt="Home">
			</a>
			<nav class="nav-links" aria-label="Primary">
				<a href="/">DESIGN</a>
				<a href="/old-home/">ARTWORK</a>
				<a href="/old-home/">ABOUT</a>
			</nav>
		</div>
	</header>

	<main class="page">
		<section class="hero" aria-label="Penny hero">
			<div class="hero-inner">
				<div class="hero-title">penny.</div>
				<div class="hero-sub">helping you to be mindful with you money</div>
				<img class="hero-phone left" src="/penny/assets/figma/image16.png" alt="Penny app screen mockup 1">
				<img class="hero-phone right" src="/penny/assets/figma/image17.png" alt="Penny app screen mockup 2">
				<div class="pig-chip" aria-hidden="true">
					<img src="/penny/assets/figma/pig-mascot.png" alt="">
				</div>
			</div>
		</section>
	</main>
</body>
</html>
